name: Process Sensing Technologies
description: >-
  Process Sensing Technologies (PST) is a measurement instrumentation group that
  designs and manufactures precision sensors and analyzers for moisture, humidity,
  dew point, oxygen, and trace gas measurement across industrial, pharmaceutical,
  food, and life-science applications. Its brand portfolio includes Michell
  Instruments, Rotronic, Analytical Industries, Ntron, SensoScientific, and Isensix,
  spanning process gas analysis and real-time environmental monitoring. The company
  now operates under the DwyerOmega brand following its combination with Dwyer
  Instruments. It was surfaced as a Battery Ventures portfolio company and added to
  the API Evangelist network for enrichment; probing of its public web surface found
  hardware, software downloads, calibration tooling, and monitoring platforms but no
  public developer API, SDK, or documentation portal.
